<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Signal Lost | AeroTask Pro</title>

    <!-- CSS Links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />

    <!-- Scripts with DEFER -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Centered 404 Content -->
    <main
      class="container my-5 flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center"
    >
      <!-- Broken satellite/radar icon -->
      <i
        class="fa-solid fa-satellite text-secondary opacity-50 mb-4"
        style="font-size: 6rem"
      ></i>

      <h1 class="display-1 fw-bold text-dark mb-0">404</h1>
      <h2 class="fw-bold mb-3 text-primary">Signal Lost</h2>

      <p class="lead text-muted mb-5" style="max-width: 500px">
        The coordinates you entered do not match any known sectors in our
        database. The mission profile you are looking for may have been deleted,
        moved, or never existed.
      </p>

      <a href="index.html" class="btn btn-primary btn-lg px-4 shadow-sm">
        <i class="fa-solid fa-house-chimney me-2"></i> Return to Mission Control
      </a>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>
  </body>
</html>
